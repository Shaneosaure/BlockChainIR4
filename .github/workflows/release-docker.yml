name: 🐳 Publish Docker Image on Release

on:
  release:
    types: [published]  # Déclenche lors d'une nouvelle release GitHub (vX.Y.Z)

permissions:
  contents: read
  packages: write   # Autorise la publication dans GHCR
  attestations: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/blockchainir4
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          
      - name: Show published tags
        run: |
          echo "🚀 Image publiée avec les tags :"
          echo "${{ steps.meta.outputs.tags }}"
